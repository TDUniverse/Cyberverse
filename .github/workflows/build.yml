name: CI Build
on:
  push:
    branches: [ "master", "feature/ci" ]
  pull_request:
    branches: [ "master" ]

jobs:
  server-tests:
    # The layout tests compare the C# protocol structs with the C++ ones as clang lays them out on the runner's
    # platform, so run them on both platforms the server runs on. Both runner images ship clang.
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5
    - name: Check out zpp_bits for the layout tests
      run: git submodule update --init --depth 1 server/Native/deps/zpp_bits
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
    - name: Run the server tests
      run: dotnet test server/Managed.Tests

  docker-server:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Copying the protocol files
      run: cp -rv shared/protocol server/protocol
    - uses: docker/setup-buildx-action@v4
    - name: Build the Docker image
      uses: docker/build-push-action@v7
      with:
        context: server
        file: server/Dockerfile
        push: false
        load: true # needed so the smoke test below can run the image
        tags: cyberverse-server:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Smoke test the server image
      # The native library only prints this line after GameNetworkingSockets initialized and the socket is listening,
      # so it also catches missing/unresolvable .so files, which a managed-only log line would not.
      run: |
        docker run -d --name cyberverse-server cyberverse-server:ci
        for i in $(seq 1 30); do
          logs=$(docker logs cyberverse-server 2>&1)
          if grep -q 'Server listening on port 1337' <<< "$logs" && [ -n "$(docker ps -q -f name=cyberverse-server)" ]; then
            echo "Server is up"
            exit 0
          fi
          [ -z "$(docker ps -q -f name=cyberverse-server)" ] && break
          sleep 1
        done
        echo "::error::Server did not start listening on port 1337" >&2
        docker logs cyberverse-server
        exit 1

  client:
    runs-on: windows-latest

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      # vcpkg removed the x-gha backend, so use a plain directory and cache it via actions/cache.
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: vcpkg-binary-${{ runner.os }}-${{ hashFiles('client/red4ext/vcpkg.json', '.github/workflows/build.yml') }}
          restore-keys: vcpkg-binary-${{ runner.os }}-
      - uses: lukka/get-cmake@latest
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@main
        id: runvcpkg
        with:
          # The vcpkg.json file, which will be part of cache key computation. Without a vcpkgGitCommitId, run-vcpkg also
          # checks vcpkg out at this manifest's builtin-baseline.
          vcpkgJsonGlob: 'client/red4ext/vcpkg.json'
      - name: Generate build output folder
        run: mkdir '${{ github.workspace }}\client\red4ext\build\ninja-vcpkg'
      - name: Run CMake with vcpkg.json manifest
        uses: lukka/run-cmake@v10
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/client/red4ext/CMakeLists.txt'
          configurePreset: ninja-vcpkg
          buildPreset: ninja-vcpkg
          buildPresetAdditionalArgs: '[`--config Release`]'
      - name: List $RUNNER_WORKSPACE after build
        run: find $RUNNER_WORKSPACE
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: RED4ext Plugin
          path: client/red4ext/build/ninja-vcpkg/src/*.dll
